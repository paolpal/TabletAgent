[project]
name = "tablet-agent-backend"
version = "0.1.0"
description = "Backend dell'assistente per dispositivi meno recenti"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "deepagents>=0.3,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "ddgs>=9,<10",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "langchain[mcp]>=1.4,<2",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
