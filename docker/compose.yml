name: tablet-agent
services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      STREAM_BUFFER_MS: ${STREAM_BUFFER_MS:-350}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPEN_ROUTER_KEY: ${OPEN_ROUTER_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      DATABASE_PATH: /data/chats.sqlite3
    volumes:
      - chats:/data
    x-casaos:
      envs:
        - container: AGENT_MODE
          description:
            en_US: "Agent mode: mock or openrouter"
            it_IT: "Modalità dell'agente: mock oppure openrouter"
        - container: OPENROUTER_API_KEY
          description:
            en_US: OpenRouter API key
            it_IT: Chiave API OpenRouter
        - container: OPENROUTER_MODEL
          description:
            en_US: OpenRouter model identifier
            it_IT: Identificatore del modello OpenRouter
      volumes:
        - container: /data
          description:
            en_US: Persistent conversation database
            it_IT: Database persistente delle conversazioni
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${TABLET_AGENT_PORT:-8088}:8080"
    depends_on:
      - backend
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: Web interface
            it_IT: Interfaccia web
volumes:
  chats:

# CasaOS/ZimaOS metadata. The default icon is served by the CasaOS portal.
x-casaos:
  id: xyz.palumbolab.tabletagent
  main: frontend
  index: /
  port_map: "${TABLET_AGENT_PORT:-8088}"
  scheme: http
  icon: "${CASAOS_ICON_URL:-/img/tablet-agent.png}"
  title:
    en_US: Tablet Agent
    it_IT: Tablet Agent
  tagline:
    en_US: An assistant for older tablets
    it_IT: Un assistente per tablet meno recenti
  description:
    en_US: A lightweight chat interface with an AI assistant and persistent conversation history.
    it_IT: Una chat leggera con assistente AI e cronologia delle conversazioni persistente.
  category: AI
  author: Paolo Palumbo
  developer: Paolo Palumbo
  version: "0.1.0"
  repo: https://github.com/paolpal/TabletAgent
