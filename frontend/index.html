<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tablet Agent">
  <meta name="theme-color" content="#19191c">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Tablet Agent</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-mark" src="mark.svg?v=2" alt=""><span>tablet<span class="brand-light">agent</span></span></div>
      <button class="new-chat" id="new-chat" type="button"><span>＋</span> Nuova conversazione</button>
      <div class="sidebar-heading" id="sidebar-heading">CONVERSAZIONI</div>
      <nav id="chats" class="chat-list" aria-label="Conversazioni"></nav>
      <div class="sidebar-footer"><span class="connection-dot"></span> Il tuo spazio di lavoro <span class="footer-caption">Tablet Agent</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menu" class="menu-button" type="button" aria-label="Chiudi conversazioni" title="Chiudi conversazioni" aria-controls="sidebar" aria-expanded="true"><img id="menu-icon" src="sidebar-open.svg" alt=""></button>
        <div class="top-title"><span class="top-icon"><img src="mark.svg?v=2" alt=""></span><span>Assistente <small>Il tuo assistente personale</small></span></div>
        <span class="top-badge"><span class="connection-dot"></span> Pronto ad aiutarti</span>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer-area">
        <div class="composer-inner">
          <p id="status" class="status error" role="status">Caricamento della chat…</p>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="message">Scrivi un messaggio</label>
            <textarea id="message" rows="2" maxlength="20000" placeholder="Scrivi un messaggio..."></textarea>
            <div class="composer-bottom"><span>Chiedimi qualsiasi cosa</span><button id="send" type="submit" aria-label="Invia messaggio"><img src="arrow-up.svg" alt=""></button></div>
          </form>
          <p class="disclaimer">Le risposte possono contenere errori. Verifica le informazioni importanti.</p>
        </div>
      </div>
    </main>
  </div>
  <script>
    /* Show startup errors even on old Safari, before the app has initialised. */
    window.tabletStartupError = function (message) {
      var output = document.getElementById('status');
      var request;
      if (output) {
        output.className = 'status error';
        output.textContent = 'Errore di avvio: ' + message;
      }
      try {
        request = new XMLHttpRequest();
        request.open('GET', '/api/health?client_error=' + encodeURIComponent(String(message).slice(0, 200)), true);
        request.send(null);
      } catch (error) {}
    };
    window.onerror = function (message, source, line) {
      window.tabletStartupError(String(message) + (line ? ' (riga ' + line + ')' : ''));
      return false;
    };
  </script>
  <script src="marked.min.js?v=2" onerror="tabletStartupError('impossibile caricare il renderer Markdown')"></script>
  <script src="suggestions.js?v=2" onerror="tabletStartupError('impossibile caricare i suggerimenti')"></script>
  <script src="app.js?v=8" onerror="tabletStartupError('impossibile caricare la chat')"></script>
</body>
</html>
